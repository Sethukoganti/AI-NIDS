# ---------------------------------------------------------------------------
# nginx config for the AI-NIDS SPA container.
#
#  * serves the Vite build with SPA fallback (client-side routing)
#  * proxies /api (REST + SSE) and /docs to the backend container
#  * adds basic security headers
# ---------------------------------------------------------------------------
upstream ainids_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Hashed Vite assets are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # REST API - buffering off so streaming/progress responses are not held back.
    location /api/ {
        proxy_pass http://ainids_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # Server-Sent Events (Live Traffic Simulation)
        proxy_set_header Connection "";
        chunked_transfer_encoding on;
    }

    # FastAPI interactive docs
    location ~ ^/(docs|redoc|openapi\.json) {
        proxy_pass http://ainids_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
